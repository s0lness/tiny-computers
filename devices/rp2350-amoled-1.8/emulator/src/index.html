<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>device emulator</title>
    <!-- No <link rel="icon">: Bun's HTML bundler tries to resolve it as a
         build asset and fails the whole page. The browser auto-requests
         /favicon.ico, unhandled here on purpose (this is a dev tool, not a
         desktop app with a taskbar icon to wire). -->
    <link rel="stylesheet" href="./family-budget.css" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="root">
      <div class="topbar">
        <b id="deviceName">device emulator</b>
        <span id="reloadDot" class="reload-dot" title="watching the wasm build for changes"></span>
        <!-- Detection: unmistakable, no reload needed - see main.ts's
             updateDevlinkStatusUI and devlinkClient.ts. Text, not just a
             dot: "no device" has to be readable at a glance, not inferred
             from a colour. -->
        <span id="devlinkStatus" class="devlink-status">no device</span>
        <!-- Sound is a device OUTPUT (the same samples the firmware plays,
             see audio.ts), so it sits with the device's own identity here,
             not in the input group or the capture actions. -->
        <button id="btnMute" class="chrome-btn icon-btn" title="mute">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9v6h4l5 5V4L8 9H4z" />
            <path d="M16 8.5a4.5 4.5 0 0 1 0 7" />
            <path d="M19 6a8 8 0 0 1 0 12" />
          </svg>
        </button>
        <span class="spacer"></span>
        <!-- capture: quiet, text-only, grouped. "png" named a file format,
             not what pressing it does, so it is an icon (a camera) instead;
             see the redesign report for the rest of that audit. -->
        <button id="btnPng" class="chrome-btn icon-btn" title="save a screenshot of the panel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="7" width="18" height="13" rx="2" />
            <path d="M8 7l1.5-3h5L16 7" />
            <circle cx="12" cy="13.5" r="3.5" />
          </svg>
        </button>
        <button id="btnFreeze" class="chrome-btn" title="freeze: screenshot + state + recent input, written for an agent to read">freeze</button>
        <button id="btnSaveTrace" class="chrome-btn" title="save the full input trace (replayable)">save</button>
        <label class="chrome-btn filebtn" title="load a saved trace and replay it">load<input id="traceFileInput" type="file" accept="application/json" /></label>
        <span class="divider"></span>
        <button id="btnQuit" class="btn danger sm">quit</button>
      </div>

      <div id="wasmError" class="wasm-error hidden"></div>

      <div class="layout">
        <div id="stage" class="stage">
          <div id="deviceWrap" class="device-wrap">
            <div id="bezel" class="bezel">
              <canvas id="panel" class="panel"></canvas>
              <canvas id="overlay" class="overlay-canvas"></canvas>
              <!-- buttons are inserted here at runtime, one per emu_device() entry -->
            </div>
          </div>
        </div>

        <div class="side controls">
          <h3>input</h3>
          <div class="toggle-row">
            <input id="overlayOn" type="checkbox" />
            <!-- "overlay" named the rendering mechanism, not what it shows
                 you; "contact" says what a fingertip is doing. -->
            <label for="overlayOn" title="show the touch disc, trail and coordinates on the panel">contact</label>
          </div>
          <div class="toggle-row">
            <input id="touchDefectsOn" type="checkbox" />
            <label for="touchDefectsOn" title="simulate a real touch controller: report rate, dropped contact, stray reports. Off = clean pass-through">defects</label>
          </div>
          <!-- Finger size is a QUANTITY (contact diameter, mm); the
               presets are shortcuts to a value, not the only values, so
               the number is the primary control and they set it.
               Order, per owner feedback: label, then the input, then the
               presets that set it. -->
          <div class="field-label">finger size</div>
          <div class="contact-row">
            <input id="contactMm" type="number" min="1" max="20" step="0.5" class="control mm-input" title="contact diameter, millimetres" />
            <span class="unit">mm</span>
            <span id="contactPx" class="px-readout"></span>
          </div>
          <div id="contactPreset" class="segtog seg-sm"></div>
          <details class="disclosure">
            <summary>tune</summary>
            <div id="touchControls"></div>
            <button id="btnResetTouch" class="chrome-btn">reset</button>
          </details>

          <h3>device</h3>
          <div id="appStripWrap" class="hidden">
            <div id="appStrip" class="app-strip"></div>
          </div>

          <!-- Live tunables (emu_abi.h's "tunables"): built entirely from
               the firmware's own declaration, same as buttonToolbox/
               sensorToolbox above - see tunables.ts. Hidden whenever the
               loaded module declares none (a board build without
               SKETCH_LIVE_TUNE, or any firmware with nothing tunable). -->
          <div id="tuneToolboxWrap" class="hidden">
            <details class="disclosure" open>
              <summary>live tuning</summary>
              <p class="tune-note">Approximates the real controller. Only the
                device itself proves a value survives a real finger -
                <code>bun tools/dev.ts tune set &lt;name&gt; &lt;value&gt;</code>.</p>
              <div id="tuneToolbox"></div>
            </details>
          </div>

          <h3>console</h3>
          <div id="consolePane" class="console-pane"></div>
        </div>
      </div>

      <!-- Fixed to the viewport, not the device: the puck can be dragged
           anywhere on the stage and stays the visual centre of the page,
           but these controls stay put at the bottom centre. -->
      <div class="bottom-bar">
        <div class="stage-controls">
          <!-- TURN: which of the panel's four edges is being lifted, and
               (unchanged) the view rotation for reading a landscape app
               sideways - now the SAME control, on purpose (main.ts's
               quickDeg header comment, docs/decisions/0003): turning the
               puck to read chrono/timer sideways and turning it to reach a
               different tilt.h TILT_UP_* edge had to stop being two numbers
               that could quietly disagree. data-deg values are the ABI:
               emulator/scripts/verify-ui-feedback.ts and puckpose.ts's
               gravityFromPose() both key off them, so keep 0/90/-90/180. -->
          <span class="segtog seg-sm" id="rotQuick" title="turn: which edge points up when tilted (also the view rotation for reading a landscape app sideways)">
            <button data-deg="0" title="TOP edge up (0&deg;)">TOP</button>
            <button data-deg="90" title="RIGHT edge up (90&deg;)">RIGHT</button>
            <button data-deg="180" title="BOTTOM edge up (180&deg;)">BOTTOM</button>
            <button data-deg="-90" class="active" title="LEFT edge up (-90&deg;) - the default view rotation for a landscape app read sideways">LEFT</button>
          </span>
          <!-- TILT: degrees off flat, 0-180 (tilt.h's own tiltDeg field: 0
               flat screen up, 90 on edge, 180 screen down). Turn and tilt
               together are the ONLY two numbers this page sends the
               firmware - see main.ts's sendGravity() and puckpose.ts. -->
          <span class="tilt-control" title="tilt: 0&deg; flat, 90&deg; on edge, 180&deg; screen down">
            <input id="tilt" type="range" min="0" max="180" step="1" value="90" class="tilt-slider" />
            <span id="tiltReadout" class="pill hint">on edge</span>
          </span>
          <!-- Owner feedback: the device's own buttons and sensors belong
               with the other physical-manipulation controls (tilt, rotate),
               not buried in the sidebar. buttonToolbox/sensorToolbox are
               filled per-button/per-sensor from the device descriptor (see
               main.ts's buildChrome), same as the bezel itself: nothing
               here names "boot"/"pwr"/"shake" specifically. btnChord is the
               one device-specific control, because the BOOT+PWR chord is a
               real, specific gesture this runtime recognises (see main.ts's
               performChord), not a generic per-button affordance. -->
          <div id="buttonToolbox" class="toolbox-group"></div>
          <div id="sensorToolbox" class="toolbox-group"></div>
          <button id="btnChord" class="chrome-btn deck-btn" title="BOOT+PWR chord: opens/closes the app menu">menu</button>
          <span class="divider"></span>
          <button id="btnPause" class="chrome-btn deck-btn" title="pause the tick loop">&#10074;&#10074;</button>
          <button id="btnStep" class="chrome-btn deck-btn" title="advance one frame">&#9654;&#124;</button>
          <span id="replayBar" class="pill hint hidden"></span>
          <button id="btnStopReplay" class="chrome-btn hidden">stop replay</button>
        </div>
        <div id="diagStrip" class="diag-strip"></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
